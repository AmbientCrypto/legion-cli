# GoReleaser v2. `goreleaser release --snapshot --clean --skip=publish` builds
# everything locally and publishes nothing (the ci workflow does that on PRs).
version: 2
project_name: legion

before:
  hooks:
    - go mod download

builds:
  - id: legion
    main: ./cmd/legion
    binary: legion
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}

archives:
  - id: legion
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "legion_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]

release:
  github:
    owner: AmbientCrypto
    name: legion-cli

