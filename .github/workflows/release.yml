# Release on a version tag: git tag v1.2.3 && git push origin v1.2.3.
# GoReleaser builds darwin/linux/windows x amd64/arm64, the archives and
# checksums.txt, and publishes the GitHub release that install.sh downloads.
# Same module-access pattern as ci.yml: the token reaches git only on the
# `go mod download` step; GoReleaser builds from the module cache.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the release and upload assets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
        env:
          GOPRIVATE: github.com/AmbientCrypto/*
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          GOPRIVATE: github.com/AmbientCrypto/*
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOFLAGS: -mod=readonly
          GOPROXY: off
