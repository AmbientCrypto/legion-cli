# Every push to main releases (LGN-501), the way legion-controller does:
#
#   1. ci-green: wait for the ci workflow on this same commit; anything but
#      success stops the release.
#   2. release (serialized): resolve the next version from the latest v* tag
#      (patch, or [minor]/[major] anywhere in the commit message), tag locally,
#      run GoReleaser: darwin/linux/windows x amd64/arm64 archives and
#      checksums.txt on a DRAFT release pinned to this commit. Then mint the tag
#      through the Git Data API and publish the draft as the latest release,
#      which install.sh and `legion update` read.
#
# A failed run leaves at most a draft, which the next run of the same version
# replaces. workflow_dispatch is a dry run: a snapshot build, nothing published.
# Tags are created through the API, not `git push`: a tag push from
# GITHUB_TOKEN is rejected once a workflow file is in history, and an API-made
# tag does not trigger another workflow run.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SEED_VERSION: "0.1.0"
  GOPRIVATE: github.com/AmbientCrypto/*

jobs:
  ci-green:
    name: ci passed on this commit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
    steps:
      - name: Wait for the ci workflow on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=1"
          for _ in $(seq 1 90); do
            run=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" "$url" | jq -c '.workflow_runs[0] // empty')
            status=$(jq -r '.status // ""' <<< "$run"); conclusion=$(jq -r '.conclusion // ""' <<< "$run")
            echo "ci: ${status:-not started} ${conclusion}"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] && exit 0
              echo "::error::ci on ${GITHUB_SHA} concluded '${conclusion}': not releasing"; exit 1
            fi
            sleep 30
          done
          echo "::error::ci on ${GITHUB_SHA} did not finish in 45 min: not releasing"; exit 1

  release:
    name: Build & release
    needs: [ci-green]
    # ci-green is skipped for workflow_dispatch (the dry run).
    if: always() && (needs.ci-green.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.ci-green.result == 'skipped'))
    runs-on: ubuntu-latest
    # Two quick merges must not race the tag-derived version.
    concurrency:
      group: legion-cli-release
      cancel-in-progress: false
    permissions:
      contents: write # createRef for the tag; release create and publish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # tags and history: the version and the changelog need them
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GO_MODULES_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          previous="$(git tag --list 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          latest="$({ echo "${previous}"; echo "${SEED_VERSION}"; } | sort -V | tail -n1)"
          IFS=. read -r maj min pat <<<"${latest}"
          case "$(git log -1 --pretty=%B)" in
            *"[major]"*) maj=$((maj + 1)); min=0; pat=0 ;;
            *"[minor]"*) min=$((min + 1)); pat=0 ;;
            *) pat=$((pat + 1)) ;;
          esac
          {
            echo "version=${maj}.${min}.${pat}"
            echo "tag=v${maj}.${min}.${pat}"
            echo "previous_tag=${previous:+v${previous}}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved v${maj}.${min}.${pat} (previous: ${previous:-none})"

      - name: Mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Dry run (${{ github.event_name }}): snapshot build, nothing is tagged or released"
          fi

      - name: Tag locally for GoReleaser
        if: steps.mode.outputs.release == 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null || git tag "${TAG}" HEAD
          [ "$(git rev-list -n1 "${TAG}")" = "${GITHUB_SHA}" ] || { echo "::error::${TAG} does not point at ${GITHUB_SHA}"; exit 1; }

      - name: GoReleaser (draft release)
        if: steps.mode.outputs.release == 'true'
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.ver.outputs.tag }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.ver.outputs.previous_tag }}
          GOFLAGS: -mod=readonly
          GOPROXY: "off"

      - name: GoReleaser snapshot (dry run)
        if: steps.mode.outputs.release != 'true'
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          GOFLAGS: -mod=readonly
          GOPROXY: "off"

      - name: Push release tag
        if: steps.mode.outputs.release == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        with:
          script: |
            const tag = process.env.TAG;
            try {
              await github.rest.git.createRef({ ...context.repo, ref: `refs/tags/${tag}`, sha: context.sha });
              core.info(`Created ${tag} at ${context.sha}`);
            } catch (e) {
              if (e.status !== 422) throw e;
              const { data } = await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              if (data.object.sha !== context.sha) core.setFailed(`${tag} already exists at ${data.object.sha}, expected ${context.sha}`);
              else core.info(`${tag} already exists at ${context.sha}, nothing to do`);
            }

      - name: Publish release
        if: steps.mode.outputs.release == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        with:
          script: |
            const { TAG: tag, VERSION: version } = process.env;
            const want = ['checksums.txt'];
            for (const os of ['darwin', 'linux']) for (const arch of ['amd64', 'arm64']) want.push(`legion_${version}_${os}_${arch}.tar.gz`);
            for (const arch of ['amd64', 'arm64']) want.push(`legion_${version}_windows_${arch}.zip`);
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const draft = releases.filter((r) => r.draft && r.tag_name === tag).sort((a, b) => b.id - a.id)[0];
            if (!draft) return core.setFailed(`no draft release for ${tag}`);
            const names = draft.assets.map((a) => a.name);
            for (const w of want) if (!names.includes(w)) return core.setFailed(`draft ${tag} is missing ${w} (has: ${names.join(', ')})`);
            await github.rest.repos.updateRelease({ ...context.repo, release_id: draft.id, draft: false, make_latest: 'true' });
            core.info(`Published ${tag} (${draft.html_url})`);
